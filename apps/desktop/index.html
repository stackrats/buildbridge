<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#09090b" />
        <title>buildbridge</title>
        <script>
            // Apply the persisted theme before first paint so neither the splash nor the app
            // flashes the wrong background (mirrors src/lib/prefs.ts).
            try {
                var theme = localStorage.getItem('buildbridge.theme');
                var dark =
                    theme === 'dark' ||
                    (theme !== 'light' &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (_) {}
        </script>
        <style>
            html {
                background: #fafafa;
            }
            html.dark {
                background: #09090b;
            }
            /* The splash: shown until Vue mounts and replaces #app's children. Plain CSS with
               the palette's zinc values, because nothing of the app has loaded yet. */
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    'Helvetica Neue',
                    Arial,
                    sans-serif;
                color: #18181b;
            }
            html.dark #splash {
                color: #fafafa;
            }
            /* The stacked logo matches docs/images/buildbridge-logo-{light,dark}.svg. Both
               halves are outlines sized by their height, so no font has to have loaded. */
            #splash .lockup {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            #splash .lockup svg {
                width: auto;
                flex: none;
            }
            #splash .lockup .mark {
                height: 64px;
            }
            #splash .lockup .wordmark {
                height: 27px;
            }
            #splash p {
                margin: 0;
                font-size: 13px;
                color: #71717a;
            }
            html.dark #splash p {
                color: #a1a1aa;
            }
        </style>
    </head>
