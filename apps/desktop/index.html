<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#09090b" />
        <title>BuildBridge</title>
        <script>
            // Apply the persisted theme before first paint so neither the splash nor the app
            // flashes the wrong background (mirrors src/lib/prefs.ts).
            try {
                var theme = localStorage.getItem('buildbridge.theme');
                var dark =
                    theme === 'dark' ||
                    (theme !== 'light' &&
                        window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (_) {}
        </script>
        <style>
            html {
                background: #fafafa;
            }
            html.dark {
                background: #09090b;
            }
            /* The splash: shown until Vue mounts and replaces #app's children. Plain CSS with
               the palette's zinc values, because nothing of the app has loaded yet. */
            #splash {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 12px;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    'Helvetica Neue',
                    Arial,
                    sans-serif;
                color: #18181b;
            }
            html.dark #splash {
                color: #fafafa;
            }
            /* The stacked logo matches docs/images/buildbridge-logo-{light,dark}.svg.
               Keep the wordmark font stack in sync with src/style.css. */
            #splash .lockup {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }
            #splash .lockup svg {
                height: 64px;
                width: auto;
                flex: none;
            }
            #splash .lockup span {
                font-family:
                    'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 28px;
                font-weight: 500;
                line-height: 1;
                letter-spacing: -0.025em;
                white-space: nowrap;
            }
            #splash p {
                margin: 0;
                font-size: 13px;
                color: #71717a;
            }
            html.dark #splash p {
                color: #a1a1aa;
            }
        </style>
    </head>

    <body>
        <div id="app">
            <div id="splash">
                <div class="lockup" role="img" aria-label="BuildBridge">
                    <!-- Same geometry as components/ui/BrandMark.vue and assets/icons. -->
                    <svg viewBox="0 0 818 516" fill="none" aria-hidden="true" focusable="false">
                        <defs>
                            <mask
                                id="splash-gap"
                                maskUnits="userSpaceOnUse"
                                x="0"
                                y="0"
                                width="818"
                                height="516"
                            >
                                <rect width="818" height="516" fill="#fff" />
                                <path
                                    d="M296.43,266.33 L556.27,485.79"
                                    stroke="#000"
                                    stroke-width="129"
                                />
                            </mask>
                        </defs>
                        <g
                            stroke="currentColor"
                            stroke-width="53"
                            stroke-linejoin="miter"
                            stroke-miterlimit="10"
                        >
                            <path
                                mask="url(#splash-gap)"
                                d="M287.91,290.98 A90.5,117.5 0 0 1 222,489.5 H116.5 A90,90 0 0 1 26.5,399.5 V63.5 L63.5,26.5 H241 A71.5,113.5 0 0 1 241,253.5 M505.5,452.5 V63.5 L542.5,26.5 H720 A71.5,113.5 0 0 1 720,253.5 M505.5,253.5 H720"
                            />
                            <path
                                d="M26.5,253.5 H241 A110,110 0 0 1 311.98,279.46 L535.51,468.26 A90,90 0 0 0 593.58,489.5 H701 A90.5,117.5 0 0 0 701,253.5"
                            />
                        </g>
                    </svg>
                    <span>BuildBridge</span>
                </div>
                <p>Build and sign iOS and Android apps from Linux</p>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
