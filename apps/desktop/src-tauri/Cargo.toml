[package]
name = "buildbridge-desktop"
version.workspace = true
description = "BuildBridge cross-platform runner"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buildbridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
buildbridge-contract.workspace = true
buildbridge-docker-osx.workspace = true
buildbridge-runner.workspace = true
jsonwebtoken.workspace = true
keyring = "4.2"
reqwest.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
ts-rs.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["parsing"] }
tauri-plugin-dialog = "2"
