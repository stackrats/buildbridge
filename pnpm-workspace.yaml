packages:
    - apps/*
    - packages/*

allowBuilds:
    esbuild: true
    vue-demi: true

catalog:
    vite: npm:@voidzero-dev/vite-plus-core@0.2.7
    vite-plus: 0.2.7

overrides:
    vite: 'catalog:'

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'

verifyDepsBeforeRun: false
